# DEMO override for a local machine. Do not use in production.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# Runs as Development with sample data and the demo accounts shown on the login page (password: FROGFRAME_DEMO_PASSWORD,
# default FrogFrame#2026), and publishes the PostgreSQL port and the SeaweedFS S3 port on localhost only (for
# "dotnet run" with Persistence:Provider=PostgreSql and Storage:Provider=S3, Storage:S3:ServiceUrl=http://localhost:8333).

services:
  app:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Demo__SeedData=true
      - Demo__ShowAccounts=true
      - Demo__Password=${FROGFRAME_DEMO_PASSWORD:-FrogFrame#2026}
      # Load tests (k6) from one machine: raise every API tier.
      - Api__RateLimitPerMinute=10000
      - Api__WriteRateLimitPerMinute=10000
      - Api__HeavyRateLimitPerMinute=10000

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  seaweedfs:
    ports:
      - "127.0.0.1:8333:8333"
