# Dependabot version updates: weekly pull requests for outdated dependencies, grouped to keep the number of PRs low.
# Security updates are separate (repository Settings → Code security → Dependabot security updates).
version: 2
updates:
  # NuGet packages of the solution (FrogFrame.sln and its projects)
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels: ["dependencies", "nuget"]
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Azure.*"]
        update-types: ["minor", "patch"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  # .NET SDK version in global.json
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    labels: ["dependencies", "dotnet"]

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  # Base image of the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    labels: ["dependencies", "docker"]

  # Images in docker-compose.yml (PostgreSQL, SeaweedFS). PostgreSQL major versions need a dump/restore or
  # pg_upgrade, so only minor and patch updates are proposed for it.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    labels: ["dependencies", "docker"]
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
