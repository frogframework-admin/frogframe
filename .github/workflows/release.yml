name: Release

# Builds the application image, smoke-tests it, publishes it to GitHub Container Registry (GHCR), deploys it to
# staging and, after approval, to production. Each deployment is smoke-tested and rolled back automatically when the
# smoke test fails (deploy.yml). See docs/guides/release.md.
#
#   - Push a tag vX.Y.Z           -> image ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y, :latest and :sha-<commit>;
#                                    staging, then production (after approval)
#   - Run manually (Actions tab)  -> image :sha-<commit> (and the branch name); staging optional
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the image to staging after publishing it
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build, smoke-test and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Tests (in-memory)
        run: dotnet run --project tests/Framework.Tests/Framework.Tests.csproj --configuration Release --no-build

      - name: Publish application
        run: dotnet publish src/Apps.Erp/Apps.Erp.csproj --configuration Release --no-restore --output ./publish

      - name: Image name
        id: ref
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "image=${image}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ref.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local, for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: frogframe-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image (Production mode, fresh database)
        run: |
          set -euo pipefail
          admin_password="$(openssl rand -base64 24)"
          cat > .env <<ENV
          ASPNETCORE_ENVIRONMENT=Production
          FROGFRAME_IMAGE=frogframe-app:ci
          FROGFRAME_PUBLIC_BASE_URL=http://localhost:5080
          FROGFRAME_ALLOWED_HOSTS=localhost
          FROGFRAME_HTTP_PORT=5080
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          FROGFRAME_RO_PASSWORD=$(openssl rand -hex 24)
          FROGFRAME_S3_ACCESS_KEY=$(openssl rand -hex 20)
          FROGFRAME_S3_SECRET_KEY=$(openssl rand -hex 32)
          FROGFRAME_ADMIN_USER=admin
          FROGFRAME_ADMIN_PASSWORD=${admin_password}
          FROGFRAME_DEMO_SEED_DATA=false
          FROGFRAME_DEMO_SHOW_ACCOUNTS=false
          ENV
          sed -i 's/^ *//' .env
          echo "::add-mask::${admin_password}"
          docker compose up -d --no-build
          bash deploy/scripts/smoke-test.sh http://localhost:5080 admin "${admin_password}"

      - name: Logs of the smoke-test stack
        if: failure()
        run: docker compose logs --no-color --tail=300 || true

      - name: Stop the smoke-test stack
        if: always()
        run: docker compose down -v || true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  staging:
    name: Staging
    needs: image
    # Version tags, and manual runs that ask for it, once deployments are switched on with the repository variable
    # DEPLOY_STAGING=true (after the "staging" environment is configured; see docs/guides/release.md).
    if: vars.DEPLOY_STAGING == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.deploy_staging)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.image }}
    secrets: inherit

  production:
    name: Production
    needs: [image, staging]
    # Version tags only, with the repository variable DEPLOY_PRODUCTION=true. Required reviewers on the "production"
    # environment approve the deployment before it starts.
    if: vars.DEPLOY_PRODUCTION == 'true' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
