name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: frogframe
          POSTGRES_USER: frogframe
          POSTGRES_PASSWORD: frogframe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure Read-Only Database Role
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U frogframe -d frogframe -f - < deploy/sql/reporting-readonly-user.sql

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -i "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run In-Memory Tests
        run: dotnet run --project tests/Framework.Tests/Framework.Tests.csproj --configuration Release --no-build

      - name: Run Full PostgreSQL Test Suite (including Reporting & Migrations)
        env:
          FROGFRAME_TEST_PG: "Host=127.0.0.1;Port=5432;Database=frogframe;Username=frogframe;Password=frogframe"
          FROGFRAME_TEST_PG_RO: "Host=127.0.0.1;Port=5432;Database=frogframe;Username=frogframe_ro;Password=ganti-password-ini"
        run: dotnet run --project tests/Framework.Tests/Framework.Tests.csproj --configuration Release --no-build

