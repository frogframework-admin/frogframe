name: frogframe

# Defaults to Development (development phase): demo data and demo accounts listed on the login page.
# Going live: set ASPNETCORE_ENVIRONMENT=Production in .env; demo mode then turns off by itself, and the application
# refuses to start if demo mode is still switched on (see docs/guides/deployment-checks.md).
# All secrets come from a .env file (not tracked by git): copy .env.example to .env and fill it in.
#
#   cp .env.example .env
#   docker compose up -d
#
# Local demo with the PostgreSQL/S3 ports published on localhost (for "dotnet run" against the containers):
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# Image: built locally from ./publish by default. Set FROGFRAME_IMAGE (e.g. ghcr.io/<owner>/<repo>:1.4.0) to run a
# released image instead: docker compose pull app migrate && docker compose up -d --no-build (see docs/guides/release.md).
#
# Start order: postgres → db-backup (snapshot before migrating) → migrate (applies database migrations once, then exits)
# → app. The app does not migrate by itself (Database__MigrateOnStartup=false), so several app instances can be
# updated one by one without racing on the schema. See docs/guides/database-migrations.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FROGFRAME_IMAGE:-frogframe-app:latest}
    container_name: frogframe-app
    ports:
      - "${FROGFRAME_HTTP_PORT:-5080}:8080"
    environment: &app-environment
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      # Migrations run in the 'migrate' service below; the app waits until the schema is up to date.
      - Database__MigrateOnStartup=false
      # Public URL accessed by end users; used for password reset links in emails.
      - App__PublicBaseUrl=${FROGFRAME_PUBLIC_BASE_URL:?Set FROGFRAME_PUBLIC_BASE_URL in .env}
      # Host names allowed in the Host header (separated by ';'). "*" is rejected in Production.
      - AllowedHosts=${FROGFRAME_ALLOWED_HOSTS:?Set FROGFRAME_ALLOWED_HOSTS in .env}
      # When deployed behind a reverse proxy, set the proxy CIDR so X-Forwarded-* headers are trusted, e.g. 172.18.0.0/16.
      - ForwardedHeaders__KnownNetworks__0=${FROGFRAME_TRUSTED_PROXY_CIDR:-}
      - Persistence__Provider=PostgreSql
      - ConnectionStrings__FrogFrame=Host=postgres;Port=5432;Database=frogframe;Username=frogframe;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - ConnectionStrings__FrogFrameReadOnly=Host=postgres;Port=5432;Database=frogframe;Username=frogframe_ro;Password=${FROGFRAME_RO_PASSWORD:?Set FROGFRAME_RO_PASSWORD in .env}
      # Demo mode is always on in Development and off elsewhere. These switches only matter outside Development: demo
      # seeding creates accounts such as 'admin' (System Manager) with a shared password, so outside Development it only
      # starts when FROGFRAME_DEMO_ALLOW_OUTSIDE_DEVELOPMENT=true and FROGFRAME_DEMO_PASSWORD is your own long password.
      - Demo__SeedData=${FROGFRAME_DEMO_SEED_DATA:-false}
      - Demo__ShowAccounts=${FROGFRAME_DEMO_SHOW_ACCOUNTS:-false}
      - Demo__Password=${FROGFRAME_DEMO_PASSWORD:-}
      - Demo__AllowOutsideDevelopment=${FROGFRAME_DEMO_ALLOW_OUTSIDE_DEVELOPMENT:-false}
      # Initial admin. Only created when the account does not exist yet; change the password after first login.
      - Bootstrap__AdminUserName=${FROGFRAME_ADMIN_USER:-admin}
      - Bootstrap__AdminPassword=${FROGFRAME_ADMIN_PASSWORD:?Set FROGFRAME_ADMIN_PASSWORD in .env}
      - Api__RateLimitPerMinute=${FROGFRAME_API_RATE_LIMIT:-300}
      # Two-factor authentication and single sign-on. See docs/guides/two-factor-and-sso.md.
      - Security__TwoFactor__Issuer=${FROGFRAME_2FA_ISSUER:-FrogFrame}
      - Security__TwoFactor__RequiredForRoles__0=${FROGFRAME_2FA_REQUIRED_ROLES:-}
      - Authentication__AllowedEmailDomains__0=${FROGFRAME_SSO_ALLOWED_DOMAIN:-}
      - Authentication__Google__ClientId=${FROGFRAME_SSO_GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret=${FROGFRAME_SSO_GOOGLE_CLIENT_SECRET:-}
      - Authentication__Microsoft__ClientId=${FROGFRAME_SSO_MICROSOFT_CLIENT_ID:-}
      - Authentication__Microsoft__ClientSecret=${FROGFRAME_SSO_MICROSOFT_CLIENT_SECRET:-}
      - Authentication__Microsoft__TenantId=${FROGFRAME_SSO_MICROSOFT_TENANT_ID:-}
      # AI designer (Azure OpenAI in Microsoft Foundry). Off unless FROGFRAME_AI_ENABLED=true. See docs/guides/ai-designer.md.
      - AI__Enabled=${FROGFRAME_AI_ENABLED:-false}
      - AI__Endpoint=${FROGFRAME_AI_ENDPOINT:-}
      - AI__Deployment=${FROGFRAME_AI_DEPLOYMENT:-}
      - AI__Auth=${FROGFRAME_AI_AUTH:-ManagedIdentity}
      - AI__ManagedIdentityClientId=${FROGFRAME_AI_MANAGED_IDENTITY_CLIENT_ID:-}
      - AI__ApiKey=${FROGFRAME_AI_API_KEY:-}
      # File & attachment contents: S3 = SeaweedFS below (default), Database = PostgreSQL bytea as before.
      # Records (owner, document link, size) always stay in PostgreSQL. See docs/guides/object-storage.md.
      - Storage__Provider=${FROGFRAME_STORAGE_PROVIDER:-S3}
      - Storage__S3__ServiceUrl=${FROGFRAME_S3_SERVICE_URL:-http://seaweedfs:8333}
      - Storage__S3__Bucket=${FROGFRAME_S3_BUCKET:-frogframe}
      - Storage__S3__AccessKey=${FROGFRAME_S3_ACCESS_KEY:?Set FROGFRAME_S3_ACCESS_KEY in .env}
      - Storage__S3__SecretKey=${FROGFRAME_S3_SECRET_KEY:?Set FROGFRAME_S3_SECRET_KEY in .env}
      # Moves contents uploaded before the switch from PostgreSQL to the bucket (in the background, resumable).
      - Storage__MigrateExisting=${FROGFRAME_STORAGE_MIGRATE_EXISTING:-true}
    depends_on:
      postgres:
        condition: service_started
      seaweedfs:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Applies pending database migrations once and exits (same image and settings as the app, web server not started).
  # The app starts only after it succeeded. Run it by hand with: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FROGFRAME_IMAGE:-frogframe-app:latest}
    container_name: frogframe-migrate
    command: ["--migrate-only"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      db-backup:
        condition: service_completed_successfully
    restart: "no"

  # Snapshot before migrating: pg_dump into the frogframe-backups volume on every "docker compose up" of an existing
  # database (skipped for a new, empty one), verified with pg_restore --list, keeping the newest
  # FROGFRAME_PRE_MIGRATE_BACKUP_KEEP files. FROGFRAME_PRE_MIGRATE_BACKUP=false skips it. Not a replacement for
  # scheduled backups (deploy/scripts/backup-db.sh, docs/backup-disaster-recovery.md).
  db-backup:
    image: postgres:17-alpine
    container_name: frogframe-db-backup
    environment:
      PGHOST: postgres
      PGDATABASE: frogframe
      PGUSER: frogframe
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_ENABLED: ${FROGFRAME_PRE_MIGRATE_BACKUP:-true}
      BACKUP_KEEP: ${FROGFRAME_PRE_MIGRATE_BACKUP_KEEP:-5}
      BACKUP_DIR: /backups
      TZ: Asia/Jakarta
    entrypoint: ["/bin/sh", "/opt/frogframe/pre-migrate-backup.sh"]
    volumes:
      - ./deploy/docker/pre-migrate-backup.sh:/opt/frogframe/pre-migrate-backup.sh:ro
      # Restore drill (docs/backup-disaster-recovery.md):
      #   docker compose run --rm --no-deps --entrypoint sh db-backup /opt/frogframe/restore-drill.sh
      - ./deploy/scripts/restore-drill.sh:/opt/frogframe/restore-drill.sh:ro
      - frogframe-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # S3-compatible object storage for file contents (SeaweedFS, Apache-2.0). Single node: master + volume + filer + S3
  # in one container. Credentials come from .env; the S3 port is only reachable inside the compose network.
  seaweedfs:
    image: chrislusf/seaweedfs:${FROGFRAME_SEAWEEDFS_VERSION:-4.48}
    container_name: frogframe-seaweedfs
    environment:
      S3_ACCESS_KEY: ${FROGFRAME_S3_ACCESS_KEY:?Set FROGFRAME_S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${FROGFRAME_S3_SECRET_KEY:?Set FROGFRAME_S3_SECRET_KEY in .env}
      TZ: Asia/Jakarta
    entrypoint: ["/bin/sh", "-c"]
    # The S3 identity file is written from the environment at start (not stored in the image or the volume).
    command:
      - |
        umask 077
        printf '{"identities":[{"name":"frogframe","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0
    # Intentionally NO "ports": only the app talks to the object store.
    volumes:
      - frogframe-seaweedfs:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: frogframe-postgres
    environment:
      POSTGRES_DB: frogframe
      POSTGRES_USER: frogframe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FROGFRAME_RO_PASSWORD: ${FROGFRAME_RO_PASSWORD:?Set FROGFRAME_RO_PASSWORD in .env}
      TZ: Asia/Jakarta
    # Intentionally NO "ports": the database is only reachable from the internal compose network.
    volumes:
      - frogframe-pg:/var/lib/postgresql/data
      # Creates the read-only user for SQL Dashboards when the database is first created,
      # with the password from FROGFRAME_RO_PASSWORD.
      - ./deploy/sql/reporting-readonly-user.sql:/opt/frogframe/reporting-readonly-user.sql:ro
      - ./deploy/docker/init-readonly-user.sh:/docker-entrypoint-initdb.d/10-reporting-readonly-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frogframe -d frogframe"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  frogframe-pg:
  frogframe-backups:
  frogframe-seaweedfs:
