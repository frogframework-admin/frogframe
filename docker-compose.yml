services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docframe-app
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Persistence__Provider=PostgreSql
      - ConnectionStrings__DocFrame=Host=postgres;Port=5432;Database=docframe;Username=docframe;Password=docframe
      - ConnectionStrings__DocFrameReadOnly=Host=postgres;Port=5432;Database=docframe;Username=docframe_ro;Password=ganti-password-ini
      # Mode Demo: otomatis membuat akun demo + data awal + menampilkan akun di halaman login
      - Demo__SeedData=true
      - Demo__Password=DocFrame#2026
      - Demo__ShowAccounts=true
      # Akun bootstrap admin (opsional jika tanpa data demo):
      - Bootstrap__AdminUserName=admin
      - Bootstrap__AdminPassword=DocFrame#2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: docframe-postgres
    environment:
      POSTGRES_DB: docframe
      POSTGRES_USER: docframe
      POSTGRES_PASSWORD: docframe
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - docframe-pg:/var/lib/postgresql/data
      # Membuat user read-only untuk Dashboard SQL saat database pertama kali dibuat.
      - ./deploy/sql/reporting-readonly-user.sql:/docker-entrypoint-initdb.d/10-reporting-readonly-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docframe -d docframe"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  docframe-pg:
